<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Scheda Anagrafica</title>
</head>
<body>

    <h1>Scheda Anagrafica</h1>

    <table border="1" cellpadding="5" cellspacing="0">
        <tr>
            <td>Nome:</td>
            <td><input type="text" name="nome"></td>
        </tr>
        <tr>
            <td>Cognome:</td>
            <td><input type="text" name="cognome"></td>
        </tr>
        <tr>
            <td>Età:</td>
            <td><input type="number" name="eta"></td>
        </tr>
        <tr>
            <td>Indirizzo:</td>
            <td><input type="text" name="indirizzo"></td>
        </tr>
        <tr>
            <td>Sesso:</td>
            <td>
                <input type="radio" name="sesso" value="Maschio"> Maschio
                <input type="radio" name="sesso" value="Femmina"> Femmina
                <input type="radio" name="sesso" value="Altro"> Altro
            </td>
        </tr>
    </table>

</body>
</html>

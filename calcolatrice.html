<!DOCTYPE html>
<html>
<body>

  <input type="text" id="espressione">
  <button onclick="addOp('+')">+</button>
  <button onclick="addOp('-')">-</button>
  <button onclick="addOp('*')">*</button>
  <button onclick="addOp('/')">/</button>
  <button onclick="calcola()">=</button>
  <div id="risultato"></div>

  <script>
    let parsing = [];

    function addOp(op) {
      let input = document.getElementById("espressione");
      if (input.value !== "") {
        parsing.push(Number(input.value));
        parsing.push(op);
        input.value = "";
      }
    }

    function calcola() {
      let input = document.getElementById("espressione");
      if (input.value !== "") {
        parsing.push(Number(input.value));
        input.value = "";
      }

      let i = 0;
      while (i < parsing.length) {
        if (parsing[i] === "*" || parsing[i] === "/") {
          let res = parsing[i] === "*" ? parsing[i - 1] * parsing[i + 1] : parsing[i - 1] / parsing[i + 1];
          parsing.splice(i - 1, 3, res);
        } else {
          i++;
        }
      }

      let tot = parsing[0];
      for (let j = 1; j < parsing.length; j += 2) {
        if (parsing[j] === "+") tot += parsing[j + 1];
        if (parsing[j] === "-") tot -= parsing[j + 1];
      }

      document.getElementById("risultato").innerHTML = tot;
      parsing = [];
    }
  </script>

</body>
</html>
